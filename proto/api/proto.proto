syntax = "proto3";

package api;
option go_package = "github.com/wutdahack1337/room_minh_house;pb";

import "google/api/annotations.proto";
import "gogoproto/gogo.proto";

service Query {
    rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse) {
        option (google.api.http) = {
            post: "/api/rooms"
            body: "room"
        };
    }
    rpc UpdateRoom(UpdateRoomRequest) returns (UpdateRoomResponse) {
        option (google.api.http) = {
            put: "/api/rooms/{room.room_number}"
            body: "room"
        };
    }
    rpc DeleteRoom(DeleteRoomRequest) returns (DeleteRoomResponse) {
        option (google.api.http).delete = "/api/rooms/{room_number}";
    }
    rpc GetRoom(GetRoomRequest) returns (GetRoomResponse) {
        option (google.api.http).get = "/api/rooms/{room_number}";
    }
    rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse) {
        option (google.api.http).get = "/api/rooms";
    }

    // ==============================================================

    rpc CreateMeterReading(CreateMeterReadingRequest) returns (CreateMeterReadingResponse) {
        option (google.api.http) = {
            post: "/api/rooms/{meter_reading.room_number}/meter-readings"
            body: "meter_reading"
        };
    }
    rpc UpdateMeterReading(UpdateMeterReadingRequest) returns (UpdateMeterReadingResponse) {
        option (google.api.http) = {
            put: "/api/rooms/{meter_reading.room_number}/meter-readings/{meter_reading.period}"
            body: "meter_reading"
        };
    }
    rpc GetMeterReading(GetMeterReadingRequest) returns (GetMeterReadingResponse) {
        option (google.api.http).get = "/api/rooms/{room_number}/meter-readings/{period}";
    }
    rpc ListMeterReadings(ListMeterReadingsRequest) returns (ListMeterReadingsResponse) {
        option (google.api.http).get = "/api/rooms/{room_number}/meter-readings";
    }

    // ==============================================================

    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
        option (google.api.http) = {
            post: "/api/users"
            body: "user"
        };
    }
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
        option (google.api.http) = {
            put: "/api/users/{user.pid}"
            body: "user"
        };
    }
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
        option (google.api.http).delete = "/api/users/{pid}";
    }
    rpc GetUser(GetUserRequest) returns (GetUserResponse) {
        option (google.api.http).get = "/api/users/{pid}";
    }
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
        option (google.api.http).get = "/api/users";
    }

    // ==============================================================

    rpc CreateContract(CreateContractRequest) returns (CreateContractResponse) {
        option (google.api.http) = {
            post: "/api/contracts"
            body: "contract"
        };
    }
    rpc UpdateContract(UpdateContractRequest) returns (UpdateContractResponse) {
        option (google.api.http) = {
            put: "/api/contracts/{contract.contract_id}"
            body: "contract"
        };
    }
    rpc DeleteContract(DeleteContractRequest) returns (DeleteContractResponse) {
        option (google.api.http).delete = "/api/contracts/{contract_id}";
    }
    rpc GetContract(GetContractRequest) returns (GetContractResponse) {
        option (google.api.http).get = "/api/contracts/{contract_id}";
    }
    rpc ListContracts(ListContractsRequest) returns (ListContractsResponse) {
        option (google.api.http).get = "/api/contracts";
    }

    // ==============================================================

    rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse) {
        option (google.api.http).get = "/api/health";
    }
}


message Room {
    int32 room_number = 1 [(gogoproto.moretags) = "bson:\"room_number\""];
    double price = 2 [(gogoproto.moretags) = "bson:\"price\""];
    bool is_available = 3 [(gogoproto.moretags) = "bson:\"is_available\""];
}

message CreateRoomRequest {
    Room room = 1;
}
message CreateRoomResponse {
    Room room = 1;
}

message UpdateRoomRequest {
    Room room = 1; // must include id
}
message UpdateRoomResponse {
    Room room = 1;
}

message DeleteRoomRequest {
    int32 room_number = 1;
}
message DeleteRoomResponse {}

message GetRoomRequest {
    int32 room_number = 1;
}
message GetRoomResponse {
    Room room = 1;
}

message ListRoomsRequest {}
message ListRoomsResponse {
    repeated Room rooms = 1;
}

// ==============================================================

message MeterReading {
    int32 room_number = 1 [(gogoproto.moretags) = "bson:\"room_number\""]; // format: MM-YYYY, e.g. "08-2025"
    string period = 2 [(gogoproto.moretags) = "bson:\"period\""];
    double electricity_reading = 3 [(gogoproto.moretags) = "bson:\"electricity_reading\""];
    double water_reading = 4 [(gogoproto.moretags) = "bson:\"water_reading\""];
}

message CreateMeterReadingRequest {
    MeterReading meter_reading = 1; // must include room_number and period
}
message CreateMeterReadingResponse {
    MeterReading meter_reading = 1;
}

message UpdateMeterReadingRequest {
    MeterReading meter_reading = 1; // must include room_number and period
}
message UpdateMeterReadingResponse {
    MeterReading meter_reading = 1;
}

message GetMeterReadingRequest {
    int32 room_number = 1;
    string period = 2;
}
message GetMeterReadingResponse {
    MeterReading meter_reading = 1;
}

message ListMeterReadingsRequest {
    int32 room_number = 1;
}
message ListMeterReadingsResponse {
    repeated MeterReading meter_readings = 1;
}

// ==============================================================

message IdCard {
    string name = 1 [(gogoproto.moretags) = "bson:\"name\""];
    string sex = 2 [(gogoproto.moretags) = "bson:\"sex\""];
    string date_of_birth = 3 [(gogoproto.moretags) = "bson:\"date_of_birth\""];
    string place_of_birth = 4 [(gogoproto.moretags) = "bson:\"place_of_birth\""];
}

message Account {
    string username = 1 [(gogoproto.moretags) = "bson:\"username\""];
    string password = 2 [(gogoproto.moretags) = "bson:\"password\""];
}

message User {
    string pid = 1 [(gogoproto.moretags) = "bson:\"pid\""];
    string phone_number = 2 [(gogoproto.moretags) = "bson:\"phone_number\""];
    string role = 3 [(gogoproto.moretags) = "bson:\"role\""];
    IdCard id_card = 4 [(gogoproto.moretags) = "bson:\"id_card\""]; // embedded value object
    Account account = 5 [(gogoproto.moretags) = "bson:\"account\""]; // embedded value object
}

message CreateUserRequest {
    User user = 1;
}
message CreateUserResponse {
    User user = 1;
}

message UpdateUserRequest {
    User user = 1;  // must include pid
}
message UpdateUserResponse {
    User user = 1;
}

message DeleteUserRequest {
    string pid = 1;
}
message DeleteUserResponse {}

message GetUserRequest {
    string pid = 1;
}
message GetUserResponse {
    User user = 1;
}

message ListUsersRequest {}
message ListUsersResponse {
    repeated User users = 1;
}

// ==============================================================

message Contract {
    string contract_id = 1 [(gogoproto.moretags) = "bson:\"contract_id\""];
    string user_pid = 2 [(gogoproto.moretags) = "bson:\"user_pid\""];
    int32 room_number = 3 [(gogoproto.moretags) = "bson:\"room_number\""];
    string start_date = 4 [(gogoproto.moretags) = "bson:\"start_date\""];
    string end_date = 5 [(gogoproto.moretags) = "bson:\"end_date\""];
    int32 duration_months = 6 [(gogoproto.moretags) = "bson:\"duration_months\""];
    string status = 7 [(gogoproto.moretags) = "bson:\"status\""];
}

message CreateContractRequest {
    Contract contract = 1;
}
message CreateContractResponse {
    Contract contract = 1;
}

message UpdateContractRequest {
    Contract contract = 1; // must include contract_id
}
message UpdateContractResponse {
    Contract contract = 1;
}

message DeleteContractRequest {
    string contract_id = 1;
}
message DeleteContractResponse {}

message GetContractRequest {
    string contract_id = 1;
}
message GetContractResponse {
    Contract contract = 1;
}

message ListContractsRequest {}
message ListContractsResponse {
    repeated Contract contracts = 1;
}

// ==============================================================

message CheckHealthRequest {}
message CheckHealthResponse {
    string status = 1;
}